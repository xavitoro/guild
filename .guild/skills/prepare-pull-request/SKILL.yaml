schema: guild.skill-manifest/v1
id: prepare-pull-request
name: Prepare a pull request
goal: Package a verified change into a pull request with a clear description and linked evidence.
applicable_profiles:
- workflow-knowledge-orchestrator
- product-software-engineer
- web-experience-engineer
- database-engineer
- integration-engineer
- data-analytics-engineer
inputs:
- Verified code change
- Passing gate results
outputs:
- Pull request
steps:
- Write a description linking the requirement, the change and the verification evidence.
- Link every passing gate result the change relies on.
- Flag any known follow-up work explicitly rather than silently deferring it.
