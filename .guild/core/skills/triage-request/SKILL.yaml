schema: guild.skill-manifest/v1
id: triage-request
name: Triage a request
goal: Confirm scope, urgency and the applicable workflow for an incoming request before any other profile
  acts.
applicable_profiles:
- workflow-knowledge-orchestrator
inputs:
- Incoming request or work item
- The current ownership map
- .guild/state/project.yaml, for the project's language settings
outputs:
- Scoped brief
- Selected workflow id
- 'Ownership assignment: which areas the request touches, who owns each, and where their ledgers are'
- Language settings in .guild/state/project.yaml (conversation, state prose, git), when they were missing
- Automated pull-request review choice in .guild/state/project.yaml (profiles, agent client, CI platform),
  when it was missing
steps:
- 'Check whether .guild/state/project.yaml exists. If it does not, and the request is not itself to onboard
  or create a project, ask the human before anything else — in the language the request was written in,
  as options plus free text — whether to onboard the project first (GUILD_MASTER_SPEC.md section 9.1):
  onboard now (recommended), through onboard-existing-project, or create-new-project when the repository
  has no code yet, keeping the request to triage once onboarding closes; or continue without onboarding
  this time, which creates no project.yaml so the question comes back next run. It is a question, not
  a decision request: there is no state to record one in yet.'
- 'Read the language settings in .guild/state/project.yaml. If the project has none — always the case
  when onboarding, and the case for state created before they existed — ask the human for them before
  anything else: the language Guild converses in, the language state prose is written in, and the language
  of git history, one question each, as options plus free text (GUILD_MASTER_SPEC.md section 3.2). Ask
  in the language the request was written in, record the answers in .guild/state/project.yaml, and speak
  in the chosen conversation language from then on.'
- 'Then read pull_request_review_automation in .guild/state/project.yaml. If it is missing, ask the human
  — right after the languages, as options plus free text — whether the Barbarian and/or the Rogue should
  run automatically on every pull request as a CI job on the repository host (recommended: neither), and,
  if at least one is chosen, which agent client runs them (recommended: the client this run is in) and,
  when it cannot be read from the repository, which CI platform (GUILD_MASTER_SPEC.md section 11.4). Record
  the answer; a deferral records no profiles. A yes during onboarding is set up by the workflow''s own
  steps; a yes outside onboarding becomes a work item for the Cleric.'
- Read the request and any linked work item.
- Identify which of the six canonical workflows applies.
- Confirm scope boundaries and flag missing information back to the requester.
- Record the selection as the first step of the workflow run.
- Read the ownership map to see which areas the request touches and which profile owns each, and route
  every part to its owner rather than to whoever is available.
- Follow a pointer into an owner's ledger only where the routing decision actually needs that detail;
  otherwise route the question to the owner and let them answer it.
- Record any part of the request that no area covers as unowned, so the first profile to work on it claims
  it before starting.
- 'Check the open decision requests before starting: one whose answer would change this run''s scope is
  presented to the human first, rather than guessed at.'
