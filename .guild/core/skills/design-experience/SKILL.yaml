schema: guild.skill-manifest/v1
id: design-experience
name: Design an experience
goal: Design the user journey, information architecture and interaction specification for a requirement.
applicable_profiles:
- product-experience-designer
inputs:
- Requirements and acceptance criteria
outputs:
- Wireframes and screen-state specifications
steps:
- Map the user journey against the acceptance criteria.
- Define information architecture and screen states.
- Specify interactions and transitions between states.
