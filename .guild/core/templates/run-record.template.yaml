# Template for .guild/state/runs/<run-id>.yaml
# Validates against .guild/core/schemas/run-record.schema.json
schema: guild.run-record/v1
id: replace-with-run-id
workflow_id: replace-with-workflow-id
status: in_progress   # in_progress | completed | failed | cancelled
started_at: "2026-08-04"
completed_at: ""
initiated_by: replace-with-profile-id-or-human
steps:
  - step_id: replace-with-step-id
    status: pending   # pending | in_progress | completed | failed | skipped
    started_at: ""
    completed_at: ""
    artifacts_produced: []
    gate_results: []

# Ids of the technical-debt items this run recorded, if it found any
# (GUILD_MASTER_SPEC.md section 8.1). A run does not close with a change a
# profile noticed left as a note.
discovered_work: []
