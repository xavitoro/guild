# Template for a single work item, e.g. to append under work_items in
# .guild/state/planning/project-plan.yaml.
# Validates against .guild/core/schemas/task.schema.json
schema: guild.task/v1
id: replace-with-work-item-id   # e.g. WI-006
title: Replace with work item title
status: proposed   # proposed | planned | ready | in_progress | blocked | in_review | completed | cancelled
milestone: replace-with-milestone-id
assigned_profile: replace-with-profile-id
depends_on: []
weight: 1
description: ""
