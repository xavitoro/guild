# Template for a single work item, e.g. to append under work_items in
# .guild/state/planning/project-plan.yaml.
# Validates against .guild/core/schemas/task.schema.json
schema: guild.task/v1
id: replace-with-work-item-id   # e.g. WI-006, or TD-001 for found work
title: Replace with work item title
kind: feature   # feature | technical_debt
status: proposed   # proposed | planned | ready | in_progress | blocked | in_review | completed | cancelled
milestone: replace-with-milestone-id   # required for planned work; omitted on unscheduled found work
assigned_profile: replace-with-profile-id
depends_on: []
weight: 1
description: ""

# Found work (GUILD_MASTER_SPEC.md section 8.1) — a change a profile noticed while
# doing something else, which blocks nothing and which it is not going to make now.
# Recorded as kind: technical_debt, id in the TD- series, no milestone until the
# Paladin (product-owner) schedules it, and assigned to the profile that owns the
# area it was found in. `origin` is required for that kind:
#
# kind: technical_debt
# status: proposed
# assigned_profile: <owner of the area it was found in>
# origin:
#   discovered_by: <canonical id of the profile that found it>
#   discovered_in: <run id / step id / work item it was found during>
#   evidence:
#     - <path, artifact or check output a reader can verify>
#   ledger_entry: KN-<finding profile>-<sequence>   # optional
#   recorded_at: "YYYY-MM-DD"
# scheduled_by: product-owner   # only once it is given a milestone
