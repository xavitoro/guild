schema: guild.project-memory/v1
project: guild
version: 7
updated_at: 2026-08-04
updated_by: workflow-knowledge-orchestrator

entries:
  - id: MEM-001
    category: product
    status: verified
    statement: Guild is a portable, provider-neutral Agentic SDLC framework.
    evidence:
      - .guild/core/spec/GUILD_MASTER_SPEC.md
  - id: MEM-002
    category: architecture
    status: verified
    statement: The first implementation is declarative and does not include a mandatory multiagent runtime.
    evidence:
      - .guild/core/spec/GUILD_MASTER_SPEC.md
  - id: MEM-003
    category: architecture
    status: verified
    statement: >
      WI-001 is complete. The canonical .guild/ directory structure exists,
      with 16 JSON Schemas under .guild/core/schemas/, artifact templates under
      .guild/core/templates/, and a structural validator at
      .guild/core/evals/validate_guild.py that checks YAML/JSON syntax, schema
      validity, instance-to-schema conformance, global id uniqueness and
      depends_on reference resolution.
    evidence:
      - .guild/core/schemas/
      - .guild/core/templates/
      - .guild/core/evals/validate_guild.py
      - .guild/state/planning/project-plan.yaml
  - id: MEM-004
    category: architecture
    status: verified
    statement: >
      WI-002 is complete. All fourteen canonical agent profiles exist under
      .guild/core/agents/<id>/ as a manifest.yaml (validating against
      guild.agent-manifest/v1) plus a human-readable AGENT.md, with
      independent QA (Barbarian) and security (Rogue) gates preserved and no
      profile granted unrestricted write, merge, deploy or secret access.
      .guild/core/evals/check_agent_profiles.py proves all fourteen ids are
      present, schema-valid and unique against the spec's roster.
    evidence:
      - .guild/core/agents/
      - .guild/core/evals/check_agent_profiles.py
      - .guild/core/spec/GUILD_MASTER_SPEC.md
  - id: MEM-005
    category: architecture
    status: verified
    statement: >
      WI-003 is complete, closing milestone M1. An initial catalogue of 22
      reusable skills exists under .guild/core/skills/<id>/ (SKILL.yaml +
      SKILL.md), and all six canonical workflows (onboard-existing-project,
      create-new-project, add-feature, fix-bug, improve-product,
      review-pull-request) exist under .guild/core/workflows/<id>/ (workflow.yaml
      + workflow.md with a Mermaid diagram), each step declaring a
      responsible profile, invoked skill, artifacts, preconditions,
      completion criteria and gates, with conditional branches for optional
      database/integration/web/security/cloud/data involvement and explicit
      human-approval steps for every Red-tier action. Two example run
      records exist under .guild/state/runs/ for add-feature and fix-bug.
      .guild/core/evals/check_workflow_refs.py proves every responsible_profile,
      invoked_skill, run workflow_id and run step_id reference resolves.
    evidence:
      - .guild/core/skills/
      - .guild/core/workflows/
      - .guild/state/runs/
      - .guild/core/evals/check_workflow_refs.py
  - id: MEM-006
    category: architecture
    status: verified
    statement: >
      WI-004 is complete, closing milestone M2. A deterministic generator at
      .guild/core/adapters/generate_adapters.py derives every provider adapter
      file from canonical .guild/core/agents/ and .guild/core/skills/ sources: Codex
      skills under .agents/skills/, Claude Code subagents under
      .claude/agents/ (tool grants mechanically derived from each profile's
      allowed_capabilities, never unrestricted), Claude Code skills under
      .claude/skills/, one deterministic policy-derived deny rule
      (force-push) in .claude/settings.json, and managed, clearly-marked
      sections appended to root AGENTS.md and CLAUDE.md without touching
      existing repository-specific content. `--check` performs drift
      detection (stale, missing, hand-edited and orphaned generated files
      all fail the check), verified by deliberately breaking and restoring
      each case. .guild/core/evals/smoke_test_add_feature.py proves the
      generated adapters give complete, up-to-date coverage for the
      add-feature workflow.
    evidence:
      - .guild/core/adapters/generate_adapters.py
      - .guild/core/adapters/INSTALL.md
      - .guild/core/evals/smoke_test_add_feature.py
      - .claude/agents/
      - .agents/skills/
  - id: MEM-007
    category: architecture
    status: verified
    statement: >
      WI-005 is complete, closing milestone M3 and the full M1–M3 bootstrap
      roadmap in project-plan.yaml. No dedicated bootstrap prompt existed
      for this work item; its scope was derived from the still-unverified
      items in GUILD_MASTER_SPEC.md section 14's definition of done. Three
      fixtures were added: check_independent_gates.py (proves every agent
      manifest forbids every Red-tier policy action, every code-editing
      profile forbids self-approving its own QA/security result, and every
      workflow gate on a Red-tier action is owned by 'human'),
      check_language_neutrality.py (a deny-list scan proving no canonical
      definition names a specific language, framework or cloud vendor), and
      pilot_install_check.py (copies .guild/core/ — not .guild/state/, per
      DEC-001 — into an isolated temp directory with nothing else from this
      repo, installs it per INSTALL.md's empty-repository steps, and
      re-runs every other check from that copy — proving .guild/core/ is
      self-contained and the documented install steps work end to end).
      All three were verified by
      deliberately breaking and restoring a violation. A genuine pilot on
      an external, non-bootstrap project remains human-owned future work.
    evidence:
      - .guild/core/evals/check_independent_gates.py
      - .guild/core/evals/check_language_neutrality.py
      - .guild/core/evals/pilot_install_check.py
      - .guild/state/planning/project-plan.yaml
  - id: MEM-008
    category: architecture
    status: verified
    statement: >
      WI-006 is complete, closing milestone M4: .guild/ now has exactly two
      top-level directories. .guild/core/ holds the nine framework
      directories (spec, agents, skills, workflows, schemas, templates,
      policies, adapters, evals) and is replaceable wholesale on a Guild
      upgrade. .guild/state/ holds knowledge/, planning/, runs/ and
      project.yaml — this project's own data, never touched by an upgrade.
      Recorded as design principle 11 in GUILD_MASTER_SPEC.md and as
      decision DEC-001. Every path reference across the master spec, all
      eight Python scripts, every generated adapter, and every doc under
      .guild/ was updated accordingly; pilot_install_check.py was corrected
      to copy only .guild/core/ into its isolated test target (previously
      it copied the whole .guild/, which would have leaked this project's
      own state into a simulated empty-repo installation once the split
      existed). All five required validators, the smoke test and the pilot
      install check were re-run and pass against the new layout.
    evidence:
      - .guild/core/spec/GUILD_MASTER_SPEC.md
      - .guild/state/knowledge/decisions/DEC-001-core-state-split.yaml
      - .guild/core/evals/pilot_install_check.py
