  - id: MEM-002
    category: architecture
    status: verified
    statement: The first implementation is declarative and does not include a mandatory multiagent runtime.
    evidence:
      - .guild/core/spec/GUILD_MASTER_SPEC.md
  - id: MEM-003
    category: architecture
    status: verified
    statement: >
      WI-001 is complete. The canonical .guild/ directory structure exists,
      with 16 JSON Schemas under .guild/core/schemas/, artifact templates under
      .guild/core/templates/, and a structural validator at
      .guild/core/evals/validate_guild.py that checks YAML/JSON syntax, schema
      validity, instance-to-schema conformance, global id uniqueness and
      depends_on reference resolution.
    evidence:
      - .guild/core/schemas/
      - .guild/core/templates/
      - .guild/core/evals/validate_guild.py
      - .guild/state/planning/project-plan.yaml
  - id: MEM-004
    category: architecture
    status: verified
    statement: >
      WI-002 is complete. All fourteen canonical agent profiles exist under
      .guild/core/agents/<id>/ as a manifest.yaml (validating against
      guild.agent-manifest/v1) plus a human-readable AGENT.md, with
      independent QA (Barbarian) and security (Rogue) gates preserved and no
      profile granted unrestricted write, merge, deploy or secret access.
      .guild/core/evals/check_agent_profiles.py proves all fourteen ids are
      present, schema-valid and unique against the spec's roster.
    evidence:
      - .guild/core/agents/
      - .guild/core/evals/check_agent_profiles.py
      - .guild/core/spec/GUILD_MASTER_SPEC.md
  - id: MEM-005
    category: architecture
    status: verified
    statement: >
      WI-003 is complete, closing milestone M1. An initial catalogue of 22
      reusable skills exists under .guild/core/skills/<id>/ (SKILL.yaml +
      SKILL.md), and all six canonical workflows (onboard-existing-project,
      create-new-project, add-feature, fix-bug, improve-product,
      review-pull-request) exist under .guild/core/workflows/<id>/ (workflow.yaml
      + workflow.md with a Mermaid diagram), each step declaring a
      responsible profile, invoked skill, artifacts, preconditions,
      completion criteria and gates, with conditional branches for optional
      database/integration/web/security/cloud/data involvement and explicit
      human-approval steps for every Red-tier action. Two example run
      records exist under .guild/state/runs/ for add-feature and fix-bug.
      .guild/core/evals/check_workflow_refs.py proves every responsible_profile,
      invoked_skill, run workflow_id and run step_id reference resolves.
    evidence:
      - .guild/core/skills/
      - .guild/core/workflows/
      - .guild/state/runs/
      - .guild/core/evals/check_workflow_refs.py
  - id: MEM-006
    category: architecture
    status: verified
    statement: >
      WI-004 is complete, closing milestone M2. A deterministic generator at
      .guild/core/adapters/generate_adapters.py derives every provider adapter
      file from canonical .guild/core/agents/ and .guild/core/skills/ sources: Codex
      skills under .agents/skills/, Claude Code subagents under
      .claude/agents/ (tool grants mechanically derived from each profile's
      allowed_capabilities, never unrestricted), Claude Code skills under
      .claude/skills/, one deterministic policy-derived deny rule
      (force-push) in .claude/settings.json, and managed, clearly-marked
      sections appended to root AGENTS.md and CLAUDE.md without touching
      existing repository-specific content. `--check` performs drift
      detection (stale, missing, hand-edited and orphaned generated files
      all fail the check), verified by deliberately breaking and restoring
      each case. .guild/core/evals/smoke_test_add_feature.py proves the
      generated adapters give complete, up-to-date coverage for the
      add-feature workflow.
    evidence:
      - .guild/core/adapters/generate_adapters.py
      - .guild/core/adapters/INSTALL.md
      - .guild/core/evals/smoke_test_add_feature.py
      - .claude/agents/
      - .agents/skills/
  - id: MEM-007
    category: architecture
    status: verified
    statement: >
      WI-005 is complete, closing milestone M3 and the full M1–M3 bootstrap
      roadmap in project-plan.yaml. No dedicated bootstrap prompt existed
      for this work item; its scope was derived from the still-unverified
      items in GUILD_MASTER_SPEC.md section 14's definition of done. Three
      fixtures were added: check_independent_gates.py (proves every agent
      manifest forbids every Red-tier policy action, every code-editing
      profile forbids self-approving its own QA/security result, and every
      workflow gate on a Red-tier action is owned by 'human'),
      check_language_neutrality.py (a deny-list scan proving no canonical
      definition names a specific language, framework or cloud vendor), and
      pilot_install_check.py (copies .guild/core/ — not .guild/state/, per
      DEC-001 — into an isolated temp directory with nothing else from this
      repo, installs it per INSTALL.md's empty-repository steps, and
      re-runs every other check from that copy — proving .guild/core/ is
      self-contained and the documented install steps work end to end).
      All three were verified by
      deliberately breaking and restoring a violation. A genuine pilot on
      an external, non-bootstrap project remains human-owned future work.
    evidence:
      - .guild/core/evals/check_independent_gates.py
      - .guild/core/evals/check_language_neutrality.py
      - .guild/core/evals/pilot_install_check.py
      - .guild/state/planning/project-plan.yaml
  - id: MEM-008
    category: architecture
    status: verified
    statement: >
      WI-006 is complete, closing milestone M4: .guild/ now has exactly two
      top-level directories. .guild/core/ holds the nine framework
      directories (spec, agents, skills, workflows, schemas, templates,
      policies, adapters, evals) and is replaceable wholesale on a Guild
      upgrade. .guild/state/ holds knowledge/, planning/, runs/ and
      project.yaml — this project's own data, never touched by an upgrade.
      Recorded as design principle 11 in GUILD_MASTER_SPEC.md and as
      decision DEC-001. Every path reference across the master spec, all
      eight Python scripts, every generated adapter, and every doc under
      .guild/ was updated accordingly; pilot_install_check.py was corrected
      to copy only .guild/core/ into its isolated test target (previously
      it copied the whole .guild/, which would have leaked this project's
      own state into a simulated empty-repo installation once the split
      existed). All five required validators, the smoke test and the pilot
      install check were re-run and pass against the new layout.
    evidence:
      - .guild/core/spec/GUILD_MASTER_SPEC.md
      - .guild/state/knowledge/decisions/DEC-001-core-state-split.yaml
      - .guild/core/evals/pilot_install_check.py
  - id: MEM-009
    category: architecture
    status: verified
    statement: >
      A gap was identified: no workflow asked whether a project needs an
      isolated component catalog/visualization tool for UI components
      (deliberately provider-neutral — no specific tool is named, per
      design principle 2). Added skill maintain-component-catalog
      (web-experience-engineer / Ranger) and an optional step invoking it
      in create-new-project (new-project-07) and add-feature
      (add-feature-07), condition "when the interface includes reusable UI
      components worth developing, reviewing or visually verifying
      independently of the full application". Inserting the step required
      renumbering later steps in both workflows and updating the
      add-feature example run record and cross-referencing prose
      (on_return ranges, precondition text) accordingly; the pilot install
      check caught two stale hardcoded skill/agent counts in
      pilot_install_check.py during verification, since fixed to derive
      those counts from canonical sources instead of literals.
    evidence:
      - .guild/core/skills/maintain-component-catalog/
      - .guild/core/workflows/create-new-project/workflow.yaml
      - .guild/core/workflows/add-feature/workflow.yaml
      - .guild/state/runs/run-example-add-feature-001.yaml
  - id: MEM-010
    category: architecture
    status: verified
    statement: >
      The D&D roster was documented but barely used: aliases appeared in the
      spec table, the profile manifests and the AGENT.md headers, while every
      surface a human actually reads — approval requests, workflow diagrams
      and step tables, skill documentation, escalation prose, generated
      subagent prompts — referred to profiles by canonical id only, and the
      AGENT.md boilerplate explicitly demoted the alias to "a memorability
      aid". Section 3.1 of GUILD_MASTER_SPEC.md now makes the alias the
      human-facing name and the canonical id the machine name, with a strict
      surface split; section 11 defines the approval-request format (policy
      key, who is asking, who is blocked, evidence, effect of approving and
      of rejecting), backed by human_interaction in default-policies.yaml, an
      optional requested_by field on gate-result, and a grant-human-approval
      skill that instructs the human to return an unattributed request to the
      DM. Aliases were rendered into all 6 workflow.md step tables and Mermaid
      labels, all 23 core SKILL.md files, the skills README, all 14 AGENT.md
      files, workflow escalation/return prose, and — via
      generate_adapters.py — every generated Codex/Claude skill and Claude
      subagent prompt plus the AGENTS.md/CLAUDE.md managed blocks. Enforced by
      the new check_alias_presence.py, which also checks the reverse
      direction: no alias may appear in responsible_profile or
      applicable_profiles.
    evidence:
      - .guild/core/spec/GUILD_MASTER_SPEC.md
      - .guild/core/policies/default-policies.yaml
      - .guild/core/skills/grant-human-approval/SKILL.yaml
      - .guild/core/evals/check_alias_presence.py
  - id: MEM-011
    category: architecture
    status: verified
    statement: >
      WI-007 is complete, closing milestone M5. Profiles had responsibilities
      but no declared ownership of any part of a project, and all knowledge
      converged on one project-memory.yaml — so a profile began each step
      without a boundary or accumulated knowledge of its own, and coordination
      required the DM to have absorbed everything. Every part of a project is
      now an ownership area with exactly one owner in
      .guild/state/knowledge/ownership.yaml; a profile claims its area before
      working (skill claim-ownership) and appends what each interaction
      verified, with evidence, to its own ledger at
      .guild/state/knowledge/profiles/<profile-id>.yaml afterwards (skill
      record-profile-knowledge). Entry ids carry their owner's canonical id, so
      a misfiled entry is detectable. The DM maintains the map as pointers only
      — area, owner, ledger, newest entry, open questions, related areas — by
      construction of its schema, and connects the owners of related areas
      instead of merging their knowledge; handoffs carry knowledge_refs rather
      than restated content. The protocol is declared once per workflow as
      step_protocol, not as extra steps, so it holds in all three execution
      modes. Recorded as design principle 12 and section 7.1-7.4 of the master
      spec, as the knowledge_protocol block of default-policies.yaml, and as
      DEC-002; enforced by check_ownership_model.py, whose state half is skipped
      when .guild/state/ is absent so a core-only install still passes. This
      repository's own state was populated with nine areas and five ledgers
      derived from each work item's assigned_profile.
    evidence:
      - .guild/core/spec/GUILD_MASTER_SPEC.md
      - .guild/core/schemas/ownership-map.schema.json
      - .guild/core/schemas/profile-knowledge.schema.json
      - .guild/core/evals/check_ownership_model.py
      - .guild/state/knowledge/ownership.yaml
      - .guild/state/knowledge/decisions/DEC-002-distributed-ownership.yaml
  - id: MEM-012
    category: architecture
    status: verified
    statement: >
      WI-008 is complete, closing milestone M6. The ownership model of WI-007
      produced open questions but nothing obliged them to reach a person or be
      closed: PROJECT_STATUS.md carried four open decisions as bullet sentences
      with no owner, no options and no default, and a ledger question blocked on
      the human could sit there indefinitely. Guild now distinguishes an approval
      (a Red-tier action, blocks outright, never has a default) from a decision
      request (guild.decision-request/v1, in
      .guild/state/planning/decisions/, stating what it blocks, at least two
      options with consequences, the asking profile's recommendation, and the
      default that applies if nobody answers with when it takes effect and what
      brings it back). A default never applies before the human has been shown
      it, deferral is an explicit recorded answer rather than silence, every open
      decision is listed by id in project status, and no run closes with a
      decision it needed left unpresented. Recorded as design principle 13 and
      sections 11.1-11.2 of the master spec, the decision_protocol block of
      default-policies.yaml, the request-human-decision skill, a third
      step_protocol route (on_blocked_decision) in all six workflows, and DEC-004;
      enforced by check_human_in_the_loop.py. This project's own four open
      decisions became DR-001 to DR-004, presented with recommendations and
      defaults, and the Fighter's KNQ-business-analyst-001 was answered inside the
      roster as DEC-003 rather than escalated.
    evidence:
      - .guild/core/spec/GUILD_MASTER_SPEC.md
      - .guild/core/schemas/decision-request.schema.json
      - .guild/core/skills/request-human-decision/SKILL.yaml
      - .guild/core/evals/check_human_in_the_loop.py
      - .guild/state/planning/decisions/
      - .guild/state/knowledge/decisions/DEC-004-decision-requests.yaml
  - id: MEM-013
    category: product
    status: verified
    statement: >
      The four decisions open since the bootstrap were presented as DR-001 to
      DR-004 and answered by the human on 2026-09-01, closing every pending
      decision in the project. "Guild" is the public product and protocol name
      (DEC-005). The framework is published under MIT, as the existing LICENSE
      file already stated — the DM had recommended a permissive license with an
      explicit patent grant and the human chose the shorter form, so adopters
      have no explicit patent position (DEC-006). Adapters are generated in the
      target repository at install time rather than shipped pre-generated, which
      is what makes drift detection meaningful (DEC-007). The first public
      release ships the canonical definitions and the adapter generator, without
      a command-line interface (DEC-008). Each decision keeps the revisit trigger
      its request declared. Piloting Guild on a genuine external project is the
      only remaining roadmap work and is no longer blocked.
    evidence:
      - .guild/state/planning/decisions/
      - .guild/state/knowledge/decisions/DEC-005-public-name.yaml
      - .guild/state/knowledge/decisions/DEC-006-license.yaml
      - .guild/state/knowledge/decisions/DEC-007-adapter-distribution.yaml
      - .guild/state/knowledge/decisions/DEC-008-no-cli-in-first-release.yaml
      - LICENSE
