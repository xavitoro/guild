    answered_at: "2026-09-01"
    escalated_as: DR-001
  - id: KNQ-workflow-knowledge-orchestrator-002
    area: AREA-project-planning
    question: >
      The license this framework is published under is unconfirmed, which blocks
      any external pilot.
    blocked_on: human
    raised_at: "2026-09-01"
    status: answered
    answer: >
      Answered by the human through DR-002: MIT, as the existing LICENSE file already
      states. The DM had recommended a permissive license with a patent grant; the
      human chose the shorter form. Recorded as DEC-006.
    answered_at: "2026-09-01"
    escalated_as: DR-002
  - id: KNQ-workflow-knowledge-orchestrator-003
    area: AREA-project-planning
    question: >
      Whether the first public release includes a command-line interface is
      unresolved, and it sets the scope of that release.
    blocked_on: human
    raised_at: "2026-09-01"
    status: answered
    answer: >
      Answered by the human through DR-004: the first public release ships the
      definitions and the adapter generator, without a command-line interface.
      Recorded as DEC-008.
    answered_at: "2026-09-01"
    escalated_as: DR-004
