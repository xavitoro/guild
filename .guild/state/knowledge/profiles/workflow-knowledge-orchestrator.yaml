entries:
  - id: KN-workflow-knowledge-orchestrator-001
    area: AREA-guild-spec
    status: verified
    statement: >
      .guild/core/ is replaceable wholesale on a Guild upgrade and .guild/state/
      is never touched by one. Anything that must survive an upgrade — knowledge,
      planning, run history, ownership — therefore belongs under state/, and
      installing Guild elsewhere copies only core/.
    evidence:
      - .guild/core/spec/GUILD_MASTER_SPEC.md
      - .guild/state/knowledge/decisions/DEC-001-core-state-split.yaml
    recorded_at: "2026-09-01"
    promoted_to: MEM-008
  - id: KN-workflow-knowledge-orchestrator-002
    area: AREA-schemas-and-templates
    status: verified
    statement: >
      Every artifact type Guild exchanges is real only once it has a JSON Schema
      under .guild/core/schemas/ and a template beside it: validate_guild.py
      validates each instance against the schema its own `schema:` field names,
      so an artifact with no schema is silently unvalidated.
    evidence:
      - .guild/core/schemas/
      - .guild/core/templates/
      - .guild/core/evals/validate_guild.py
    recorded_at: "2026-09-01"
    promoted_to: MEM-003
  - id: KN-workflow-knowledge-orchestrator-003
    area: AREA-agent-profiles
    status: verified
    statement: >
      A profile is its manifest.yaml; AGENT.md is a human-readable view that must
      be updated with it. The alias is the name a person reads and the canonical
      id the name a machine reads, and no artifact field ever stores an alias.
    evidence:
      - .guild/core/agents/
      - .guild/core/spec/GUILD_MASTER_SPEC.md
      - .guild/core/evals/check_alias_presence.py
    recorded_at: "2026-09-01"
    promoted_to: MEM-010
  - id: KN-workflow-knowledge-orchestrator-004
    area: AREA-project-planning
    status: verified
    statement: >
      Milestones M1-M4 are complete and every work item WI-001 to WI-006 is
      closed. Progress is computed from completed weighted work items in
      project-plan.yaml, never estimated by a profile.
    evidence:
      - .guild/state/planning/project-plan.yaml
      - .guild/state/planning/PROJECT_STATUS.md
    recorded_at: "2026-09-01"
  - id: KN-workflow-knowledge-orchestrator-005
    area: AREA-project-knowledge
    status: verified
    statement: >
      Canonical memory is deliberately small. A fact reaches
      project-memory.yaml only as a memory proposal this profile accepts;
      everything else stays in its owner's ledger, and the ownership map holds
      only the pointers needed to reach an owner.
    evidence:
      - .guild/core/spec/GUILD_MASTER_SPEC.md
      - .guild/core/skills/consolidate-knowledge/SKILL.yaml
      - .guild/state/knowledge/ownership.yaml
    recorded_at: "2026-09-01"
  - id: KN-workflow-knowledge-orchestrator-006
    area: AREA-guild-spec
    status: verified
    statement: >
      Section 11.3 fixes the shape of every question Guild puts to a person:
      enumerated options, always plus a free-text option. The reason it is
      mandatory rather than courteous is that the option set is written by the
      profile that could not decide — without a way out of it, a person whose
      answer is not listed can only stay silent, and silence re-runs that
      profile's own default, which is the same outcome as never asking.
    evidence:
      - .guild/core/spec/GUILD_MASTER_SPEC.md
      - .guild/state/knowledge/decisions/DEC-009-options-plus-free-text.yaml
    recorded_at: "2026-09-07"
  - id: KN-workflow-knowledge-orchestrator-007
    area: AREA-schemas-and-templates
    status: verified
    statement: >
      decision-request.schema.json records how a request was answered through
      answer_kind (option | free_text | deferral), so a free-text answer cannot
      be quietly filed as a listed option; policies.schema.json now requires the
      human_interaction.answer_options contract, with always_enumerated,
      always_offer_free_text and free_text_is_recorded_verbatim fixed to true.
    evidence:
      - .guild/core/schemas/decision-request.schema.json
      - .guild/core/schemas/policies.schema.json
      - .guild/core/templates/decision-request.template.yaml
    recorded_at: "2026-09-07"
  - id: KN-workflow-knowledge-orchestrator-008
    area: AREA-guild-spec
    status: verified
    statement: >
      Section 8.1 makes found work a planning artifact rather than prose: a change
      found outside the current step's scope, which blocks nothing, becomes a
      technical_debt work item with an origin and an owner before the step closes,
      and is recorded unscheduled. It is the planning counterpart of 11.2 — a
      decision nobody can make reaches a person, a change nobody is making reaches
      the plan — and it is declared as design principle 14, "Nothing found is
      dropped", with definition-of-done item 14.
    evidence:
      - .guild/core/spec/GUILD_MASTER_SPEC.md
      - .guild/core/policies/default-policies.yaml
    learned_from: WI-010
    recorded_at: "2026-09-17"
  - id: KN-workflow-knowledge-orchestrator-009
    area: AREA-schemas-and-templates
    status: verified
    statement: >
      task.schema.json now carries kind, origin and scheduled_by, and requires a
      milestone only of ordinary work — a technical_debt item requires an origin
      with a finder, a place and at least one piece of evidence instead, so
      unsourced found work cannot be written. project-plan.schema.json references
      the task schema for its work items instead of restating the shape; the
      inline copy it replaced had already drifted, never having gained the
      description field the task schema and task.template.yaml both document.
    evidence:
      - .guild/core/schemas/task.schema.json
      - .guild/core/schemas/project-plan.schema.json
      - .guild/core/schemas/project-status.schema.json
      - .guild/core/schemas/run-record.schema.json
      - .guild/core/templates/task.template.yaml
    learned_from: WI-010
    recorded_at: "2026-09-17"
  - id: KN-workflow-knowledge-orchestrator-010
    area: AREA-agent-profiles
    status: verified
    statement: >
      Recording found work and scheduling it are separate capabilities in every
      manifest: all fourteen profiles allow record_technical_debt, because the
      profile that found a problem is the one holding its evidence, and only the
      product owner allows schedule_technical_debt while the other thirteen forbid
      it — the same shape as present_decision_request, and for the same reason.
    evidence:
      - .guild/core/agents/
      - .guild/core/evals/check_found_work.py
    learned_from: WI-010
    recorded_at: "2026-09-17"
  - id: KN-workflow-knowledge-orchestrator-011
    area: AREA-project-planning
    status: verified
    statement: >
      Building M8 produced four findings of its own, recorded as TD-001 to TD-004
      rather than fixed in passing, and all left unscheduled for the Paladin:
      sections 7 and 8 promise state directories that do not exist; the two
      Markdown planning views restate their canonical YAML with nothing comparing
      them; a run record cannot name the work item it advanced; and the
      required-check list is maintained in two places. They are listed by id in
      project-status.yaml and named in PROJECT_STATUS.md.
    evidence:
      - .guild/state/planning/project-plan.yaml
      - .guild/state/planning/project-status.yaml
      - .guild/state/planning/PROJECT_STATUS.md
    learned_from: WI-010
    recorded_at: "2026-09-17"

