entries:
  - id: KN-product-security-engineer-001
    area: AREA-policies-and-gates
    status: verified
    statement: >
      Nine actions are Red-tier and require explicit human approval. Every agent
      manifest forbids all nine and every workflow gate on one has
      responsible_profile 'human', so no profile can satisfy a Red-tier gate by
      its own say-so.
    evidence:
      - .guild/core/policies/default-policies.yaml
      - .guild/core/evals/check_independent_gates.py
    recorded_at: "2026-09-01"
  - id: KN-product-security-engineer-002
    area: AREA-policies-and-gates
    status: verified
    statement: >
      Only force-push is enforced as a deterministic deny rule. The other
      Red-tier actions cannot be pattern-matched from arbitrary shell commands
      across arbitrary target projects without guessing at their tooling, so they
      depend on the explicit human-approval steps — a client-side rule is a
      supplement to those steps, never a replacement.
    evidence:
      - .guild/core/adapters/generate_adapters.py
      - .claude/settings.json
    recorded_at: "2026-09-01"
  - id: KN-product-security-engineer-003
    area: AREA-policies-and-gates
    status: verified
    statement: >
      answer_options was listed as a required field of both the approval and
      the decision request and defined nowhere. It is now a declared contract:
      an approval offers approve / reject / request changes / other, a decision
      offers one key per stated option / defer / other, and
      free_text_never_counts_as_approval keeps the Red-tier boundary intact —
      a free-text answer is recorded in the gate result's notes and leaves the
      action blocked unless someone explicitly approved it.
    evidence:
      - .guild/core/policies/default-policies.yaml
      - .guild/core/schemas/policies.schema.json
      - .guild/core/spec/GUILD_MASTER_SPEC.md
    recorded_at: "2026-09-07"
  - id: KN-product-security-engineer-004
    area: AREA-policies-and-gates
    status: verified
    statement: >
      found_work_protocol in default-policies.yaml fixes where found work goes,
      what it becomes, who records it, who it is assigned to and who may schedule
      it, with ten rules including that blocking work is not debt and that
      recording never authorizes doing. Scheduling is a capability boundary rather
      than an approval gate: found work carries no Red-tier risk, so it needs an
      owner and a prioritizer, not a human approval.
    evidence:
      - .guild/core/policies/default-policies.yaml
      - .guild/core/schemas/policies.schema.json
      - .guild/core/evals/check_found_work.py
    learned_from: WI-010
    recorded_at: "2026-09-17"
