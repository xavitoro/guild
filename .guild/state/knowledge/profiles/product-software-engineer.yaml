    area: AREA-provider-adapters
    question: >
      Whether adapters are generated at install time or shipped pre-generated
      changes what drift detection can prove, and is not decidable from this
      repository alone.
    blocked_on: human
    raised_at: "2026-09-01"
    status: answered
    answer: >
      Answered by the human through DR-003: adapters are generated in the target
      at install time, as INSTALL.md describes. Recorded as DEC-007.
    answered_at: "2026-09-01"
