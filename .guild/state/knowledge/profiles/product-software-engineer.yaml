entries:
  - id: KN-product-software-engineer-001
    area: AREA-provider-adapters
    status: verified
    statement: >
      Every provider file is derived from .guild/core/agents/ and
      .guild/core/skills/ by generate_adapters.py, which never reads its own
      output to decide what to produce. `--check` detects stale, missing,
      hand-edited and orphaned generated files, so an adapter is never
      hand-maintained.
    evidence:
      - .guild/core/adapters/generate_adapters.py
      - .guild/core/adapters/INSTALL.md
      - .guild/core/evals/smoke_test_add_feature.py
    recorded_at: "2026-09-01"
    promoted_to: MEM-006
  - id: KN-product-software-engineer-002
    area: AREA-provider-adapters
    status: verified
    statement: >
      Subagent tool grants are derived mechanically from each profile's
      allowed_capabilities through the CAP_TOOLS map and are never unrestricted;
      a capability with no mapping silently grants nothing, so adding a
      capability means adding its mapping.
    evidence:
      - .guild/core/adapters/generate_adapters.py
      - .claude/agents/
    recorded_at: "2026-09-01"
  - id: KN-product-software-engineer-003
    area: AREA-provider-adapters
    status: verified
    statement: >
      Mapping record_own_knowledge to the Write tool gives the QA and security
      subagents Write, which they previously lacked. The boundary keeping them
      out of product code is their manifests' forbidden capabilities, checked by
      check_independent_gates.py — the coarse tool grant never was that boundary,
      since both profiles already had shell access.
    evidence:
      - .guild/core/adapters/generate_adapters.py
      - .guild/core/evals/check_independent_gates.py
      - .guild/core/agents/quality-assurance-engineer/manifest.yaml
    learned_from: WI-007
    recorded_at: "2026-09-01"
  - id: KN-product-software-engineer-004
    area: AREA-provider-adapters
    status: verified
    statement: >
      Generating adapters in the target at install time is now a decided
      constraint, not an implementation detail: drift detection only proves
      anything because the generated files are produced from the canonical
      sources present in that same repository. Shipping pre-generated files would
      make the drift check compare against whatever was distributed.
    evidence:
      - .guild/state/knowledge/decisions/DEC-007-adapter-distribution.yaml
      - .guild/core/adapters/INSTALL.md
    learned_from: DR-003
    recorded_at: "2026-09-01"
  - id: KN-product-software-engineer-005
    area: AREA-provider-adapters
    status: verified
    statement: >
      The generated Codex and Claude Code skills for request-human-decision and
      grant-human-approval were regenerated from their canonical manifests after
      the free-text answer contract landed; the drift check in
      smoke_test_add_feature.py caught them stale first, which is the intended
      behaviour of generating adapters at install time (DEC-007). The managed
      blocks generate_adapters.py appends to AGENTS.md and CLAUDE.md also state
      the rule now, so the first surface any assistant reads says how a question
      may be answered. Provider-neutrality is kept by splitting the two: the spec
      fixes the shape of a question, the adapter fixes its rendering — only the
      Claude Code layer names AskUserQuestion, and only in the DM's subagent,
      since no other profile presents a request.
    evidence:
      - .claude/skills/request-human-decision/SKILL.md
      - .agents/skills/grant-human-approval/SKILL.md
      - .guild/core/adapters/generate_adapters.py
      - .claude/agents/workflow-knowledge-orchestrator.md
      - .guild/core/evals/smoke_test_add_feature.py
    recorded_at: "2026-09-07"
  - id: KN-product-software-engineer-006
    area: AREA-provider-adapters
    status: verified
    statement: >
      The generator maps record_technical_debt and schedule_technical_debt to
      Edit/Write, and every Claude Code subagent now carries a "When you find work
      you are not going to do" section derived from the same rule — with the
      product owner's scheduling clause and the orchestrator's sweep-before-
      consolidating clause added per profile, exactly as the decision note already
      did. The managed AGENTS.md and CLAUDE.md blocks gained a found-work
      paragraph, and the drift check passes against the regenerated output.
    evidence:
      - .guild/core/adapters/generate_adapters.py
      - .claude/agents/product-owner.md
      - .claude/skills/record-technical-debt/SKILL.md
      - .agents/skills/record-technical-debt/SKILL.md
    learned_from: WI-010
    recorded_at: "2026-09-17"

