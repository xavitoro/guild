# The DM's routing index: which profile owns which part of this repository,
# and where that owner's accumulated knowledge lives. Pointers only — what an
# owner knows is in its ledger, not here.
schema: guild.ownership-map/v1
project: guild
version: 3
updated_at: "2026-09-01"
updated_by: workflow-knowledge-orchestrator

areas:
  - id: AREA-guild-spec
    name: Guild master specification
    boundary: >
      The framework's own definition — design principles, roster, core concepts,
      repository layout, knowledge and planning model, permission tiers and the
      adapter model. Not the files that implement those rules; each of those has
      its own area and owner.
    owner_profile: workflow-knowledge-orchestrator
    ledger: .guild/state/knowledge/profiles/workflow-knowledge-orchestrator.yaml
    claimed_at: "2026-09-01"
    paths:
      - .guild/core/spec/
