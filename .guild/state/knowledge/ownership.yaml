      - AREA-schemas-and-templates
      - AREA-agent-profiles
      - AREA-policies-and-gates
    status: active

  - id: AREA-schemas-and-templates
    name: Artifact schemas and templates
    boundary: >
      Every JSON Schema an artifact validates against and the illustrative
      template beside it. Not the instances themselves, which belong to whichever
      area produces them.
    owner_profile: workflow-knowledge-orchestrator
    ledger: .guild/state/knowledge/profiles/workflow-knowledge-orchestrator.yaml
