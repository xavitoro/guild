schema: guild.decision-request/v1
id: DR-001
question: >
  What is the public product and protocol name? "Guild" is used everywhere in
  this repository — the framework, the roster mnemonic, the .guild/ directory
  and every schema id — but it has never been confirmed as the public name.
raised_by: workflow-knowledge-orchestrator
raised_at: "2026-09-01"
area: AREA-project-planning
source_question: KNQ-workflow-knowledge-orchestrator-001
blocks:
  - WI-008
  - Any public release of this repository
options:
  - option: A
    label: Keep "Guild" as the public product and protocol name
    consequence: >
      Nothing changes. The D&D roster, the .guild/ layout and every schema id
      stay as they are; a later conflict would mean renaming paths and schema ids.
  - option: B
    label: Choose a distinct public name before release, keeping "guild" internally
    consequence: >
      The public name and the internal vocabulary diverge, so documentation must
      teach both, but a naming conflict never forces a path or schema migration.
recommendation:
  option: A
  because: >
    The name is load-bearing across the whole repository and the roster mnemonic
    depends on it; a rename is cheap in documentation and expensive in paths and
    schema ids, so it should be done only if an actual conflict appears.
default_if_unanswered:
  option: A
  in_force_from: The first public release
  revisit_when: A trademark or naming conflict with an existing product is found
status: answered
presented_at: "2026-09-01"
answered_at: "2026-09-01"
answered_by: human
answer: A
resulting_decision: DEC-005
