overall_status: >
  Milestones M1 through M8 are all complete. WI-001 through WI-010 are done.
  .guild/ splits into core/ (the Guild framework) and state/ (this project's
  own data) — see DEC-001 — and every part of the project now has exactly one
  owning profile with its own knowledge ledger, indexed by the DM in
  .guild/state/knowledge/ownership.yaml — see DEC-002.
current_objective: >
  No decision is pending. DR-001 to DR-004 were answered by the human on
  2026-09-01 and recorded as DEC-005 to DEC-008. Whatever is left for a person
  to resolve is now asked as enumerated options that always carry a free-text
  answer — see DEC-009 — and whatever a profile finds but does not do is now an
  owned technical-debt item in the plan rather than a note — see DEC-010. Four
  such items, TD-001 to TD-004, were found while building that rule and wait for
  the Paladin (product-owner) to schedule them; none of them blocks anything. The
  only remaining planned work is piloting Guild on a genuine external project,
  which is unblocked.
