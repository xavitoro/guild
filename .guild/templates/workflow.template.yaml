# Template for .guild/workflows/<workflow-id>.yaml
# Validates against .guild/schemas/workflow.schema.json
# Each entry in steps validates against .guild/schemas/workflow-step.schema.json
schema: guild.workflow/v1
id: replace-with-workflow-id   # kebab-case, e.g. fix-bug
name: Replace with workflow name
description: >
  What this workflow accomplishes and when it applies.
status: planned
steps:
  - id: replace-with-step-id
    name: Replace with step name
    responsible_profile: replace-with-profile-id
    invoked_skill: replace-with-skill-id
    required_input_artifacts:
      - Name an artifact this step consumes.
    expected_output_artifacts:
      - Name an artifact this step produces.
    preconditions:
      - Describe a condition that must hold before this step runs.
    completion_criteria:
      - Describe how completion is recognized.
    gates:
      - Name a gate this step must pass.
    on_failure: Describe or reference the failure path.
    on_return: Describe or reference the return path, if any.
    escalation: Describe or reference the escalation path, if any.
failure_paths:
  - Describe what happens when a step in this workflow fails.
return_paths:
  - Describe when this workflow returns to an earlier step.
escalation_paths:
  - Describe when this workflow escalates to a human or another profile.
depends_on: []
